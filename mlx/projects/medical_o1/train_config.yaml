# LoRA training config for medical_o1
# Run-specific params (model, data, iters, seed) are set via CLI in medical_o1.sh

fine_tune_type: lora
optimizer: adamw
mask_prompt: true
grad_checkpoint: true
save_every: 50

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj", "self_attn.k_proj", "self_attn.o_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.05

# match to ITERS
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1e-7
  arguments: [1e-5, 600, 1e-7]  # [peak_lr, decay_steps, final_lr]
