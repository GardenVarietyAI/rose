fine_tune_type: lora
optimizer: adamw
mask_prompt: true
grad_checkpoint: true
grad_accumulation_steps: 2

seed: 42
iters: 600
steps_per_report: 10
steps_per_eval: 50
val_batches: 25
batch_size: 1
num_layers: 16
max_seq_length: 1024
save_every: 50

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj", "self_attn.k_proj", "self_attn.o_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.05

lr_schedule:
  name: cosine_decay
  warmup: 100
  warmup_init: 1e-7
  arguments: [1e-5, 600, 1e-7]  # [peak_lr, decay_steps, final_lr]
